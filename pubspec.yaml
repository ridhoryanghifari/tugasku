name: tugasku
description: TugasKu - aplikasi manajemen tugas, jadwal kuliah, dan kalender ujian untuk mahasiswa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.2.7
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: any
  sqlite3_flutter_libs: ^0.5.24
  # Dikunci ke v2: v3 memakai build hook yang gagal bila path Flutter SDK mengandung spasi (Windows).
  sqlite3: ^2.4.7
  path: ^1.9.0
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  fl_chart: ^0.69.0
  intl: any
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
  shared_preferences: ^2.3.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
